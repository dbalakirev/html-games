<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sudoku 4x4 - HTML Games</title>

  <!-- PWA Meta Tags & Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">

  <!-- iOS / iPhone 5S PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sudoku 4x4">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: calc(2rem + env(safe-area-inset-top, 0px)) calc(1rem + env(safe-area-inset-right, 0px)) calc(1rem + env(safe-area-inset-bottom, 0px)) calc(1rem + env(safe-area-inset-left, 0px));
      background-color: #f4f4f9;
      color: #333;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    header {
      margin-bottom: 1.5rem;
    }
    h1 {
      margin: 0 0 0.5rem 0;
    }
    a.back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: #4A90E2;
      text-decoration: none;
      font-weight: 600;
    }
    a.back-link:hover {
      text-decoration: underline;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(4, minmax(3.5rem, 4.5rem));
      grid-template-rows: repeat(4, minmax(3.5rem, 4.5rem));
      gap: 2px;
      background-color: #333;
      border: 3px solid #333;
      width: fit-content;
      margin: 0 auto 1.5rem auto;
    }
    .cell {
      background-color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* thicker borders around the 2x2 boxes */
    .cell[data-col="1"] { border-right: 2px solid #333; }
    .cell[data-row="1"] { border-bottom: 2px solid #333; }

    .cell.given {
      font-size: 1.5rem;
      font-weight: 700;
      color: #333;
    }
    .cell-btn {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 0;
      padding: 0;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      font-family: inherit;
      color: #4A90E2;
      background-color: #eef5fd;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    .cell-btn.selected {
      background-color: #cfe4fa;
      box-shadow: inset 0 0 0 3px #4A90E2;
    }
    .cell-btn.wrong {
      background-color: #fdecea;
      color: #d64545;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 1rem;
    }
    #numpad {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    #numpad button {
      width: 3rem;
      height: 3rem;
      padding: 0;
      font-size: 1.3rem;
    }
    #numpad button.erase {
      background-color: #8a8f98;
      font-size: 1.1rem;
    }
    button {
      font-size: 1rem;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 0.5rem;
      background-color: #4A90E2;
      color: #fff;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    button:active {
      background-color: #3a78c2;
    }
    #message {
      text-align: center;
      min-height: 1.5rem;
      font-weight: 600;
    }
    #message.success {
      color: #2e8b57;
    }
    #message.error {
      color: #d64545;
    }
  </style>
</head>
<body>
  <header>
    <a class="back-link" href="index.html">&larr; Back to games</a>
    <h1>Sudoku 4x4</h1>
    <p>Fill in the missing numbers so each row, column and 2x2 box contains 1-4.</p>
  </header>
  <main>
    <div id="board"></div>
    <div id="numpad">
      <button type="button" data-value="1">1</button>
      <button type="button" data-value="2">2</button>
      <button type="button" data-value="3">3</button>
      <button type="button" data-value="4">4</button>
      <button type="button" class="erase" data-value="">Erase</button>
    </div>
    <div class="controls">
      <button id="check-btn">Check</button>
      <button id="new-btn">New Game</button>
    </div>
    <p id="message"></p>
  </main>

  <script>
    const SIZE = 4;
    const BASE_GRID = [
      [1, 2, 3, 4],
      [3, 4, 1, 2],
      [2, 1, 4, 3],
      [4, 3, 2, 1]
    ];

    let solution = [];
    let blanks = []; // list of {row, col}
    let selected = null; // {row, col} of the currently selected blank cell

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function swapRows(grid, r1, r2) {
      [grid[r1], grid[r2]] = [grid[r2], grid[r1]];
    }

    function swapCols(grid, c1, c2) {
      for (const row of grid) {
        [row[c1], row[c2]] = [row[c2], row[c1]];
      }
    }

    function transpose(grid) {
      const result = [];
      for (let c = 0; c < SIZE; c++) {
        const row = [];
        for (let r = 0; r < SIZE; r++) {
          row.push(grid[r][c]);
        }
        result.push(row);
      }
      return result;
    }

    function generateSolution() {
      let grid = BASE_GRID.map(row => row.slice());

      // relabel digits 1-4 randomly
      const perm = shuffle([1, 2, 3, 4]);
      grid = grid.map(row => row.map(v => perm[v - 1]));

      // shuffle rows within each band, and swap the two bands
      if (Math.random() < 0.5) swapRows(grid, 0, 1);
      if (Math.random() < 0.5) swapRows(grid, 2, 3);
      if (Math.random() < 0.5) { swapRows(grid, 0, 2); swapRows(grid, 1, 3); }

      // shuffle columns within each stack, and swap the two stacks
      if (Math.random() < 0.5) swapCols(grid, 0, 1);
      if (Math.random() < 0.5) swapCols(grid, 2, 3);
      if (Math.random() < 0.5) { swapCols(grid, 0, 2); swapCols(grid, 1, 3); }

      // optionally transpose
      if (Math.random() < 0.5) grid = transpose(grid);

      return grid;
    }

    function pickBlanks() {
      const count = Math.random() < 0.5 ? 1 : 2;
      const positions = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          positions.push({ row: r, col: c });
        }
      }
      shuffle(positions);
      return positions.slice(0, count);
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = r;
          cell.dataset.col = c;

          const isBlank = blanks.some(b => b.row === r && b.col === c);
          if (isBlank) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'cell-btn';
            btn.dataset.row = r;
            btn.dataset.col = c;
            btn.dataset.value = '';
            btn.addEventListener('click', () => selectCell(r, c));
            cell.appendChild(btn);
          } else {
            cell.classList.add('given');
            cell.textContent = solution[r][c];
          }
          board.appendChild(cell);
        }
      }
    }

    function getCellBtn(row, col) {
      return document.querySelector(`.cell-btn[data-row="${row}"][data-col="${col}"]`);
    }

    function selectCell(row, col) {
      selected = { row, col };
      document.querySelectorAll('.cell-btn').forEach((btn) => {
        const isSelected = Number(btn.dataset.row) === row && Number(btn.dataset.col) === col;
        btn.classList.toggle('selected', isSelected);
      });
    }

    function selectNextEmptyCell(afterRow, afterCol) {
      const ordered = blanks.slice().sort((a, b) => (a.row - b.row) || (a.col - b.col));
      const startIndex = ordered.findIndex(b => b.row === afterRow && b.col === afterCol);
      for (let i = 1; i <= ordered.length; i++) {
        const candidate = ordered[(startIndex + i) % ordered.length];
        if (getCellBtn(candidate.row, candidate.col).dataset.value === '') {
          selectCell(candidate.row, candidate.col);
          return;
        }
      }
      selectCell(afterRow, afterCol);
    }

    function handleNumpadInput(value) {
      if (!selected) return;
      const btn = getCellBtn(selected.row, selected.col);
      btn.dataset.value = value;
      btn.textContent = value;
      btn.classList.remove('wrong');
      document.getElementById('message').textContent = '';
      document.getElementById('message').className = '';
      if (value !== '') {
        selectNextEmptyCell(selected.row, selected.col);
      }
    }

    function checkSolution() {
      const message = document.getElementById('message');
      let allFilled = true;
      let allCorrect = true;

      for (const { row, col } of blanks) {
        const btn = getCellBtn(row, col);
        const value = btn.dataset.value;
        if (!value) {
          allFilled = false;
          continue;
        }
        if (Number(value) === solution[row][col]) {
          btn.classList.remove('wrong');
        } else {
          btn.classList.add('wrong');
          allCorrect = false;
        }
      }

      message.className = '';
      if (!allFilled) {
        message.textContent = 'Fill in all the missing numbers first.';
        message.classList.add('error');
      } else if (allCorrect) {
        message.textContent = 'Solved! 🎉';
        message.classList.add('success');
      } else {
        message.textContent = 'Not quite right, keep trying.';
        message.classList.add('error');
      }
    }

    function newGame() {
      solution = generateSolution();
      blanks = pickBlanks();
      selected = null;
      document.getElementById('message').textContent = '';
      document.getElementById('message').className = '';
      renderBoard();
      selectCell(blanks[0].row, blanks[0].col);
    }

    document.getElementById('check-btn').addEventListener('click', checkSolution);
    document.getElementById('new-btn').addEventListener('click', newGame);
    document.getElementById('numpad').addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-value]');
      if (!btn) return;
      handleNumpadInput(btn.dataset.value);
    });

    newGame();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {/* ignore */});
      });
    }
  </script>
</body>
</html>

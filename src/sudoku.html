<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sudoku - HTML Games</title>

  <!-- PWA Meta Tags & Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">

  <!-- iOS / iPhone 5S PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: calc(2rem + env(safe-area-inset-top, 0px)) calc(1rem + env(safe-area-inset-right, 0px)) calc(1rem + env(safe-area-inset-bottom, 0px)) calc(1rem + env(safe-area-inset-left, 0px));
      background-color: #f4f4f9;
      color: #333;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    header {
      margin-bottom: 1.5rem;
    }
    h1 {
      margin: 0 0 0.5rem 0;
    }
    a.back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: #4A90E2;
      text-decoration: none;
      font-weight: 600;
    }
    a.back-link:hover {
      text-decoration: underline;
    }
    .mode-select {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .mode-btn {
      background-color: #dfe6ee;
      color: #333;
    }
    .mode-btn.active {
      background-color: #4A90E2;
      color: #fff;
    }
    #board {
      display: grid;
      gap: 2px;
      background-color: #333;
      border: 3px solid #333;
      width: fit-content;
      margin: 0 auto 1.5rem auto;
    }
    .cell {
      background-color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cell.given {
      font-size: var(--cell-font, 1.5rem);
      font-weight: 700;
      color: #333;
    }
    .cell-btn {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 0;
      padding: 0;
      text-align: center;
      font-size: var(--cell-font, 1.5rem);
      font-weight: 700;
      font-family: inherit;
      color: #4A90E2;
      background-color: #eef5fd;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    .cell-btn.selected {
      background-color: #cfe4fa;
      box-shadow: inset 0 0 0 3px #4A90E2;
    }
    .cell-btn.wrong {
      background-color: #fdecea;
      color: #d64545;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 1rem;
    }
    #numpad {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.5rem;
      max-width: 20rem;
      margin-left: auto;
      margin-right: auto;
    }
    #numpad button {
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      font-size: 1.2rem;
    }
    #numpad button.erase {
      background-color: #8a8f98;
      font-size: 1rem;
    }
    button {
      font-size: 1rem;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 0.5rem;
      background-color: #4A90E2;
      color: #fff;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    button:active {
      background-color: #3a78c2;
    }
    #message {
      text-align: center;
      min-height: 1.5rem;
      font-weight: 600;
    }
    #message.success {
      color: #2e8b57;
    }
    #message.error {
      color: #d64545;
    }
  </style>
</head>
<body>
  <header>
    <a class="back-link" href="index.html">&larr; Back to games</a>
    <h1>Sudoku</h1>
    <p id="instructions">Fill in the missing numbers so each row, column and box contains 1-4. Good luck!</p>
  </header>
  <main>
    <div class="mode-select" id="mode-select">
      <button type="button" class="mode-btn" data-mode="4">4x4</button>
      <button type="button" class="mode-btn" data-mode="6">6x6</button>
    </div>
    <div id="board"></div>
    <div id="numpad"></div>
    <div class="controls">
      <button id="check-btn">Check</button>
      <button id="new-btn">New Game</button>
    </div>
    <p id="message"></p>
  </main>

  <script>
    const MODES = {
      4: {
        size: 4,
        boxRows: 2,
        boxCols: 2,
        minBlanks: 1,
        maxBlanks: 2,
        base: [
          [1, 2, 3, 4],
          [3, 4, 1, 2],
          [2, 1, 4, 3],
          [4, 3, 2, 1]
        ]
      },
      6: {
        size: 6,
        boxRows: 2,
        boxCols: 3,
        minBlanks: 3,
        maxBlanks: 5,
        base: [
          [1, 2, 3, 4, 5, 6],
          [4, 5, 6, 1, 2, 3],
          [2, 3, 1, 5, 6, 4],
          [5, 6, 4, 2, 3, 1],
          [3, 1, 2, 6, 4, 5],
          [6, 4, 5, 3, 1, 2]
        ]
      }
    };

    let currentMode = MODES[4];
    let SIZE = currentMode.size;

    let solution = [];
    let blanks = []; // list of {row, col}
    let selected = null; // {row, col} of the currently selected blank cell

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function transpose(grid) {
      const result = [];
      for (let c = 0; c < SIZE; c++) {
        const row = [];
        for (let r = 0; r < SIZE; r++) {
          row.push(grid[r][c]);
        }
        result.push(row);
      }
      return result;
    }

    // Shuffles rows/columns while preserving the box structure: values are
    // shuffled within each band/stack, and whole bands/stacks are reordered.
    function permuteLines(grid, groupSize, isRow) {
      const numGroups = SIZE / groupSize;
      const groups = [];
      for (let g = 0; g < numGroups; g++) {
        const idxs = [];
        for (let i = 0; i < groupSize; i++) idxs.push(g * groupSize + i);
        shuffle(idxs);
        groups.push(idxs);
      }
      shuffle(groups);
      const order = groups.flat();
      if (isRow) {
        return order.map(i => grid[i]);
      }
      return grid.map(row => order.map(i => row[i]));
    }

    function generateSolution() {
      let grid = currentMode.base.map(row => row.slice());

      // relabel digits 1-SIZE randomly
      const perm = shuffle(Array.from({ length: SIZE }, (_, i) => i + 1));
      grid = grid.map(row => row.map(v => perm[v - 1]));

      grid = permuteLines(grid, currentMode.boxRows, true);
      grid = permuteLines(grid, currentMode.boxCols, false);

      // transpose only preserves the box layout when boxes are square
      if (currentMode.boxRows === currentMode.boxCols && Math.random() < 0.5) {
        grid = transpose(grid);
      }

      return grid;
    }

    function pickBlanks() {
      const range = currentMode.maxBlanks - currentMode.minBlanks + 1;
      const count = currentMode.minBlanks + Math.floor(Math.random() * range);
      const positions = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          positions.push({ row: r, col: c });
        }
      }
      shuffle(positions);
      return positions.slice(0, count);
    }

    // Old Safari (iOS 12 on iPhone 5S) doesn't support the CSS aspect-ratio
    // property, so the board is sized in JS to stay square and on-screen.
    function sizeBoard() {
      const board = document.getElementById('board');
      const gap = 2;
      const border = 3;
      const available = Math.min(document.documentElement.clientWidth - 32, 400);
      const totalGaps = (SIZE - 1) * gap + border * 2;
      let cellSize = Math.floor((available - totalGaps) / SIZE);
      cellSize = Math.max(32, Math.min(cellSize, 72));

      board.style.gridTemplateColumns = `repeat(${SIZE}, ${cellSize}px)`;
      board.style.gridTemplateRows = `repeat(${SIZE}, ${cellSize}px)`;
      document.documentElement.style.setProperty('--cell-font', Math.round(cellSize * 0.42) + 'px');
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = r;
          cell.dataset.col = c;

          // thicker borders between boxes
          const isLastCol = (c + 1) % currentMode.boxCols === 0 && c !== SIZE - 1;
          const isLastRow = (r + 1) % currentMode.boxRows === 0 && r !== SIZE - 1;
          if (isLastCol) cell.style.borderRight = '2px solid #333';
          if (isLastRow) cell.style.borderBottom = '2px solid #333';

          const isBlank = blanks.some(b => b.row === r && b.col === c);
          if (isBlank) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'cell-btn';
            btn.dataset.row = r;
            btn.dataset.col = c;
            btn.dataset.value = '';
            btn.addEventListener('click', () => selectCell(r, c));
            cell.appendChild(btn);
          } else {
            cell.classList.add('given');
            cell.textContent = solution[r][c];
          }
          board.appendChild(cell);
        }
      }
      sizeBoard();
    }

    function renderNumpad() {
      const numpad = document.getElementById('numpad');
      numpad.innerHTML = '';
      for (let n = 1; n <= SIZE; n++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.value = String(n);
        btn.textContent = String(n);
        numpad.appendChild(btn);
      }
      const eraseBtn = document.createElement('button');
      eraseBtn.type = 'button';
      eraseBtn.className = 'erase';
      eraseBtn.dataset.value = '';
      eraseBtn.textContent = 'Erase';
      numpad.appendChild(eraseBtn);
    }

    function getCellBtn(row, col) {
      return document.querySelector(`.cell-btn[data-row="${row}"][data-col="${col}"]`);
    }

    function selectCell(row, col) {
      selected = { row, col };
      document.querySelectorAll('.cell-btn').forEach((btn) => {
        const isSelected = Number(btn.dataset.row) === row && Number(btn.dataset.col) === col;
        btn.classList.toggle('selected', isSelected);
      });
    }

    function selectNextEmptyCell(afterRow, afterCol) {
      const ordered = blanks.slice().sort((a, b) => (a.row - b.row) || (a.col - b.col));
      const startIndex = ordered.findIndex(b => b.row === afterRow && b.col === afterCol);
      for (let i = 1; i <= ordered.length; i++) {
        const candidate = ordered[(startIndex + i) % ordered.length];
        if (getCellBtn(candidate.row, candidate.col).dataset.value === '') {
          selectCell(candidate.row, candidate.col);
          return;
        }
      }
      selectCell(afterRow, afterCol);
    }

    function handleNumpadInput(value) {
      if (!selected) return;
      const btn = getCellBtn(selected.row, selected.col);
      btn.dataset.value = value;
      btn.textContent = value;
      btn.classList.remove('wrong');
      document.getElementById('message').textContent = '';
      document.getElementById('message').className = '';
      if (value !== '') {
        selectNextEmptyCell(selected.row, selected.col);
      }
    }

    function checkSolution() {
      const message = document.getElementById('message');
      let allFilled = true;
      let allCorrect = true;

      for (const { row, col } of blanks) {
        const btn = getCellBtn(row, col);
        const value = btn.dataset.value;
        if (!value) {
          allFilled = false;
          continue;
        }
        if (Number(value) === solution[row][col]) {
          btn.classList.remove('wrong');
        } else {
          btn.classList.add('wrong');
          allCorrect = false;
        }
      }

      message.className = '';
      if (!allFilled) {
        message.textContent = 'Fill in all the missing numbers first.';
        message.classList.add('error');
      } else if (allCorrect) {
        message.textContent = 'Solved! 🎉';
        message.classList.add('success');
      } else {
        message.textContent = 'Not quite right, keep trying.';
        message.classList.add('error');
      }
    }

    function updateModeUI() {
      document.querySelectorAll('.mode-btn').forEach((btn) => {
        btn.classList.toggle('active', Number(btn.dataset.mode) === SIZE);
      });
      document.getElementById('instructions').textContent =
        `Fill in the missing numbers so each row, column and box contains 1-${SIZE}. Good luck!`;
    }

    function setMode(size) {
      currentMode = MODES[size];
      SIZE = currentMode.size;
      updateModeUI();
      newGame();
    }

    function newGame() {
      solution = generateSolution();
      blanks = pickBlanks();
      selected = null;
      document.getElementById('message').textContent = '';
      document.getElementById('message').className = '';
      renderNumpad();
      renderBoard();
      selectCell(blanks[0].row, blanks[0].col);
    }

    document.getElementById('check-btn').addEventListener('click', checkSolution);
    document.getElementById('new-btn').addEventListener('click', newGame);
    document.getElementById('numpad').addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-value]');
      if (!btn) return;
      handleNumpadInput(btn.dataset.value);
    });
    document.getElementById('mode-select').addEventListener('click', (event) => {
      const btn = event.target.closest('.mode-btn');
      if (!btn) return;
      const size = Number(btn.dataset.mode);
      if (size !== SIZE) setMode(size);
    });
    window.addEventListener('resize', sizeBoard);

    updateModeUI();
    newGame();
  </script>
  <script src="pwa.js"></script>
</body>
</html>
